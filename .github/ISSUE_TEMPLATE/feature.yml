name: Feature proposal
description: Propose one observable improvement to the ambient simulation.
title: 'feat: '
labels:
  - enhancement
body:
  - type: textarea
    id: viewer-outcome
    attributes:
      label: Viewer outcome
      description: What should someone watching the screen notice or understand?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version and who owns the behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What simpler approach or existing system could solve the same problem?
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: This works without requiring player input.
          required: true
        - label: This proposal contains no real employee or private company information.
          required: true
