<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Commitville is an autonomous pixel-art office simulation." />
    <title>Commitville</title>
  </head>
  <body>
    <main id="app" aria-label="Commitville office simulation">
      <div id="game" aria-hidden="true"></div>
      <section class="hud" aria-live="polite">
        <div>
          <p class="hud__eyebrow">Autonomous office simulation</p>
          <h1>Commitville</h1>
        </div>
        <time id="world-clock" class="hud__clock">MON 08:00</time>
      </section>
      <noscript>Commitville requires JavaScript to run.</noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
